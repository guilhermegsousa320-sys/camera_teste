<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Teste</title>

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        background: linear-gradient(135deg, #101010, #1c1c1c);
        color: white;
        font-family: Arial, Helvetica, sans-serif;
      }

      .camera-app {
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding: 12px;
      }

      h1 {
        text-align: center;
        font-size: 25px;
        margin: 10px 0 15px;
      }

      h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }

      /* CÂMERA */

      .camera-container {
        background: #181818;
        padding: 10px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .camera-view {
        position: relative;
        width: 100%;
        background: #000;
        overflow: hidden;
        border-radius: 12px;
        line-height: 0;
        aspect-ratio: 3 / 4;
      }

      #webcam {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        display: block;

        transition:
          transform 0.2s ease,
          filter 0.2s ease;
      }

      /* GRADE 3x3 */

      #grade-camera {
        position: absolute;
        inset: 0;

        display: grid;

        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);

        pointer-events: none;
        z-index: 5;
      }

      #grade-camera div {
        border-right: 1px solid rgba(255, 255, 255, 0.45);
        border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      }

      #grade-camera div:nth-child(3n) {
        border-right: none;
      }

      #grade-camera div:nth-child(n + 7) {
        border-bottom: none;
      }

      /* CONTADOR */

      #contador-temporizador {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        color: white;

        font-size: 80px;
        font-weight: bold;

        text-shadow: 0 3px 15px #000;

        z-index: 20;

        pointer-events: none;

        line-height: 1;
      }

      /* STATUS */

      #status {
        margin-top: 10px;
        padding: 10px;

        border-radius: 8px;

        background: #252525;

        color: #ddd;

        text-align: center;

        font-size: 13px;
      }

      /* BOTÕES */

      .controles {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 8px;

        margin-top: 12px;
      }

      .btn,
      .btn-filtro {
        border: none;

        min-height: 44px;

        padding: 10px;

        border-radius: 9px;

        background: #303030;

        color: white;

        font-size: 14px;

        cursor: pointer;

        touch-action: manipulation;
      }

      .btn:active,
      .btn-filtro:active {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn.principal {
        background: #1677ff;
      }

      .btn.perigo {
        background: #d62828;
      }

      /* CONFIGURAÇÕES */

      .configuracoes,
      .filtros,
      .ajustes,
      .galeria {
        margin-top: 15px;

        padding: 14px;

        background: #222;

        border-radius: 12px;
      }

      .configuracoes {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

        gap: 15px;
      }

      .controle {
        display: flex;

        flex-direction: column;

        gap: 8px;
      }

      .controle label,
      .ajuste label {
        font-size: 14px;
        font-weight: bold;
      }

      select {
        width: 100%;

        padding: 11px;

        border: none;

        border-radius: 8px;

        background: #333;

        color: white;

        font-size: 14px;
      }

      input[type="range"] {
        width: 100%;

        accent-color: #1677ff;

        height: 35px;
      }

      .checkbox {
        justify-content: center;
      }

      .checkbox input {
        width: 18px;
        height: 18px;
      }

      /* FILTROS */

      .filtros-botoes {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 7px;
      }

      .btn-filtro.ativo {
        background: #1677ff;
      }

      /* AJUSTES */

      .ajuste {
        margin-bottom: 18px;
      }

      .ajuste:last-child {
        margin-bottom: 0;
      }

      .ajuste label {
        display: flex;

        justify-content: space-between;

        margin-bottom: 5px;
      }

      /* GALERIA */

      .preview-container {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
      }

      .foto-container,
      .video-container {
        padding: 8px;

        background: #303030;

        border-radius: 10px;
      }

      .foto-container img,
      .video-container video {
        width: 100%;

        display: block;

        border-radius: 7px;

        margin-bottom: 8px;
      }

      .btn-download {
        display: block;

        padding: 10px;

        background: #1677ff;

        color: white;

        text-decoration: none;

        text-align: center;

        border-radius: 7px;

        font-size: 13px;
      }

      /* CELULARES PEQUENOS */

      @media (max-width: 400px) {
        .camera-app {
          padding: 7px;
        }

        .camera-container {
          padding: 7px;
        }

        .controles {
          grid-template-columns: 1fr;
        }

        .preview-container {
          grid-template-columns: 1fr;
        }

        #contador-temporizador {
          font-size: 65px;
        }
      }

      /* DESKTOP */

      @media (min-width: 700px) {
        .camera-view {
          aspect-ratio: 16 / 9;
        }
      }
    </style>
  </head>

  <body>
    <main class="camera-app">
      <h1>Teste</h1>

      <section class="camera-container">
        <div class="camera-view">
          <video id="webcam" autoplay playsinline muted></video>

          <div id="grade-camera">
            <div></div>
            <div></div>
            <div></div>

            <div></div>
            <div></div>
            <div></div>

            <div></div>
            <div></div>
            <div></div>
          </div>

          <div id="contador-temporizador"></div>
        </div>

        <div id="status">Câmera desligada</div>

        <canvas id="photo-canvas" style="display: none"> </canvas>

        <!-- BOTÕES -->

        <div class="controles">
          <button id="btn-iniciar" class="btn principal">
            📷 Ligar câmera
          </button>

          <button id="btn-foto" class="btn" disabled>tirar foto</button>

          <button id="btn-gravar" class="btn" disabled> Gravar</button>

          <button id="btn-torch" class="btn" disabled> Flash</button>

          <button id="btn-alternar" class="btn" disabled>
            Alternar câmera
          </button>
        </div>

        <!-- CONFIGURAÇÕES -->

        <section class="configuracoes">
          <div class="controle">
            <label> Temporizador </label>

            <select id="temporizador">
              <option value="0">desligado</option>

              <option value="3">3 segundos</option>

              <option value="5">5 segundos</option>

              <option value="10">10 segundos</option>
            </select>
          </div>

          <div class="controle">
            <label>
              🔍 Zoom:
              <span id="valor-zoom"> 1.0x </span>
            </label>

            <input
              type="range"
              id="controle-zoom"
              min="1"
              max="5"
              step=".1"
              value="1"
            />
          </div>

          <div class="controle checkbox">
            <label>
              <input type="checkbox" id="ativar-grade" />

              Mostrar grade 3×3
            </label>
          </div>
        </section>

        <!-- FILTROS -->

        <section class="filtros">
          <h2>Filtros</h2>

          <div class="filtros-botoes">
            <button class="btn-filtro ativo" data-filtro="normal">
              Normal
            </button>

            <button class="btn-filtro" data-filtro="grayscale(100%)">
              P&B
            </button>

            <button class="btn-filtro" data-filtro="sepia(100%)">Sépia</button>

            <button class="btn-filtro" data-filtro="invert(100%)">
              Negativo
            </button>

            <button class="btn-filtro" data-filtro="contrast(150%)">
              Contraste
            </button>

            <button class="btn-filtro" data-filtro="saturate(200%)">
              Saturado
            </button>

            <button class="btn-filtro" data-filtro="hue-rotate(90deg)">
              Colorido
            </button>

            <button class="btn-filtro" data-filtro="blur(3px)">Desfoque</button>
          </div>
        </section>

        <!-- AJUSTES -->

        <section class="ajustes">
          <h2>Ajustes</h2>

          <div class="ajuste">
            <label>
              <span>Brilho</span>

              <span> <span id="brilho-valor"> 100 </span>% </span>
            </label>

            <input
              type="range"
              id="controle-brilho"
              min="50"
              max="200"
              value="100"
            />
          </div>

          <div class="ajuste">
            <label>
              <span>Contraste</span>

              <span> <span id="contraste-valor"> 100 </span>% </span>
            </label>

            <input
              type="range"
              id="controle-contraste"
              min="50"
              max="200"
              value="100"
            />
          </div>

          <div class="ajuste">
            <label>
              <span>Saturação</span>

              <span> <span id="saturacao-valor"> 100 </span>% </span>
            </label>

            <input
              type="range"
              id="controle-saturacao"
              min="0"
              max="300"
              value="100"
            />
          </div>
        </section>

        <!-- GALERIA -->

        <section class="galeria">
          <h2>Galeria</h2>

          <div id="preview-container" class="preview-container"></div>
        </section>
      </section>
    </main>

    <script>
      /* ELEMENTOS */

      const video = document.getElementById("webcam");

      const canvas = document.getElementById("photo-canvas");

      const preview = document.getElementById("preview-container");

      const status = document.getElementById("status");

      const btnIniciar = document.getElementById("btn-iniciar");

      const btnFoto = document.getElementById("btn-foto");

      const btnGravar = document.getElementById("btn-gravar");

      const btnTorch = document.getElementById("btn-torch");

      const btnMudar = document.getElementById("btn-alternar");

      const botoesFiltro = document.querySelectorAll(".btn-filtro");

      const temporizador = document.getElementById("temporizador");

      const contador = document.getElementById("contador-temporizador");

      const controleZoom = document.getElementById("controle-zoom");

      const valorZoom = document.getElementById("valor-zoom");

      const ativarGrade = document.getElementById("ativar-grade");

      const grade = document.getElementById("grade-camera");

      const brilho = document.getElementById("controle-brilho");

      const contraste = document.getElementById("controle-contraste");

      const saturacao = document.getElementById("controle-saturacao");

      const brilhoValor = document.getElementById("brilho-valor");

      const contrasteValor = document.getElementById("contraste-valor");

      const saturacaoValor = document.getElementById("saturacao-valor");

      /* VARIÁVEIS */

      let stream = null;

      let gravador = null;

      let partesVideo = [];

      let cameraAtual = "user";

      let filtroAtual = "normal";

      /* STATUS */

      function mudarStatus(texto) {
        status.textContent = texto;
      }

      /* VERIFICAR SUPORTE */

      function verificarSuporte() {
        if (!navigator.mediaDevices) {
          mudarStatus(" Este navegador não permite acesso à câmera.");

          return false;
        }

        if (!navigator.mediaDevices.getUserMedia) {
          mudarStatus(" getUserMedia não é suportado.");

          return false;
        }

        return true;
      }

      /* INICIAR CÂMERA */

      async function iniciarCamera() {
        if (!verificarSuporte()) {
          return;
        }

        /* Verificação HTTPS */

        if (
          location.protocol !== "https:" &&
          location.hostname !== "localhost" &&
          location.hostname !== "127.0.0.1"
        ) {
          mudarStatus(
            " A câmera precisa de HTTPS. Abra o site usando https://",
          );

          alert(
            "Por segurança, o navegador do celular bloqueia a câmera em páginas sem HTTPS.",
          );

          return;
        }

        /* parar câmera anterior */

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());

          stream = null;
        }

        mudarStatus("solicitando permissão da câmera...");

        try {

          const constraints = {
            video: {
              facingMode: {
                ideal: cameraAtual,
              },

              width: {
                ideal: 1280,
              },

              height: {
                ideal: 720,
              },
            },

            audio: false,
          };

          stream = await navigator.mediaDevices.getUserMedia(constraints);

          video.srcObject = stream;

          await video.play();

          btnFoto.disabled = false;

          btnGravar.disabled = false;

          btnMudar.disabled = false;

          mudarStatus("✅ Câmera ligada");

          verificarFlash();

          verificarZoom();

          /*
    */

          try {
            const audioStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });

            /*
        Junta o áudio ao vídeo.
      */

            audioStream.getAudioTracks().forEach((track) => {
              stream.addTrack(track);
            });
          } catch (audioError) {
            console.warn("Microfone não autorizado:", audioError);

            mudarStatus("📷 Câmera ligada. Microfone não autorizado.");
          }
        } catch (erro) {
          console.error("Erro da câmera:", erro);

          if (erro.name === "NotAllowedError") {
            mudarStatus("Permissão da câmera negada.");

            alert(
              "Acesso à câmera foi negado. Toque no cadeado/permissões do navegador e permita o uso da câmera.",
            );
          } else if (erro.name === "NotFoundError") {
            mudarStatus("nenhuma câmera encontrada.");
          } else if (erro.name === "NotReadableError") {
            mudarStatus(" A câmera está sendo usada por outro aplicativo.");

            alert(
              "Feche outros aplicativos que possam estar usando a câmera e tente novamente.",
            );
          } else if (erro.name === "SecurityError") {
            mudarStatus(" Acesso bloqueado por segurança.");
          } else {
            mudarStatus(" Erro: " + erro.name);

            alert("Não foi possível ligar a câmera.\n\nErro: " + erro.name);
          }
        }
      }

      /* FOTO */

      async function tirarFoto() {
        if (!stream) {
          alert("Ligue a câmera primeiro.");

          return;
        }

        const segundos = Number(temporizador.value);

        if (segundos > 0) {
          await executarTemporizador(segundos);
        }

        canvas.width = video.videoWidth;

        canvas.height = video.videoHeight;

        const contexto = canvas.getContext("2d");

        contexto.filter = obterFiltroCanvas();

        contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

        contexto.filter = "none";

        const foto = canvas.toDataURL("image/png");

        criarFoto(foto);
      }

      /* CRIAR FOTO */

      function criarFoto(url) {
        const container = document.createElement("div");

        container.className = "foto-container";

        const img = document.createElement("img");

        img.src = url;

        const download = document.createElement("a");

        download.href = url;

        download.download = `foto-${Date.now()}.png`;

        download.textContent = "⬇ Baixar foto";

        download.className = "btn-download";

        container.appendChild(img);

        container.appendChild(download);

        preview.prepend(container);
      }

      /* TEMPORIZADOR */

      function executarTemporizador(segundos) {
        return new Promise((resolve) => {
          let restante = segundos;

          contador.textContent = restante;

          const intervalo = setInterval(() => {
            restante--;

            if (restante <= 0) {
              clearInterval(intervalo);

              contador.textContent = "";

              resolve();
            } else {
              contador.textContent = restante;
            }
          }, 1000);
        });
      }

      /* GRAVAÇÃO */

      function gravarVideo() {
        if (!stream) {
          alert("Ligue a câmera primeiro.");

          return;
        }

        if (gravador && gravador.state === "recording") {
          gravador.stop();

          btnGravar.textContent = " Gravar";

          btnGravar.classList.remove("perigo");

          return;
        }

        partesVideo = [];

        let opcoes = {};

        if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")) {
          opcoes.mimeType = "video/webm;codecs=vp9,opus";
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
          opcoes.mimeType = "video/webm";
        }

        try {
          gravador = new MediaRecorder(stream, opcoes);
        } catch (erro) {
          alert("Este celular não suporta gravação de vídeo nesse formato");

          return;
        }

        gravador.ondataavailable = (evento) => {
          if (evento.data && evento.data.size > 0) {
            partesVideo.push(evento.data);
          }
        };

        gravador.onstop = () => {
          const blob = new Blob(partesVideo, {
            type: gravador.mimeType || "video/webm",
          });

          const url = URL.createObjectURL(blob);

          criarVideo(url);
        };

        gravador.start();

        btnGravar.textContent = "⏹ Parar gravação";

        btnGravar.classList.add("perigo");
      }

      /* CRIAR VÍDEO */

      function criarVideo(url) {
        const container = document.createElement("div");

        container.className = "video-container";

        const videoGravado = document.createElement("video");

        videoGravado.src = url;

        videoGravado.controls = true;

        videoGravado.playsInline = true;

        const download = document.createElement("a");

        download.href = url;

        download.download = `video-${Date.now()}.webm`;

        download.textContent = "⬇ Baixar vídeo";

        download.className = "btn-download";

        container.appendChild(videoGravado);

        container.appendChild(download);

        preview.prepend(container);
      }

      /* FLASH */

      async function ativarFlash() {
        if (!stream) return;

        const track = stream.getVideoTracks()[0];

        if (!track.getCapabilities) {
          alert("Controle de flash não suportado.");

          return;
        }

        const capabilities = track.getCapabilities();

        if (!capabilities.torch) {
          alert("A lanterna não está disponível nesta câmera.");

          return;
        }

        const atual = track.getSettings();

        try {
          await track.applyConstraints({
            advanced: [
              {
                torch: !atual.torch,
              },
            ],
          });

          btnTorch.textContent = !atual.torch ? " Desligar" : " Flash";
        } catch (erro) {
          console.error(erro);

          alert("Não foi possível controlar a lanterna.");
        }
      }

      /* VERIFICAR FLASH */

      function verificarFlash() {
        if (!stream) return;

        const track = stream.getVideoTracks()[0];

        if (!track.getCapabilities) {
          btnTorch.disabled = true;

          return;
        }

        const capabilities = track.getCapabilities();

        btnTorch.disabled = !capabilities.torch;
      }

      /* ALTERNAR CÂMERA */

      async function mudarCamera() {
        cameraAtual = cameraAtual === "user" ? "environment" : "user";

        await iniciarCamera();
      }

      /* ZOOM */

      function verificarZoom() {
        if (!stream) return;

        const track = stream.getVideoTracks()[0];

        if (!track.getCapabilities) {
          return;
        }

        const capabilities = track.getCapabilities();

        if (capabilities.zoom) {
          controleZoom.min = capabilities.zoom.min;

          controleZoom.max = capabilities.zoom.max;

          controleZoom.step = capabilities.zoom.step || 0.1;

          controleZoom.value = capabilities.zoom.min;
        }

        atualizarZoom();
      }

      /* ZOOM */

      controleZoom.addEventListener("input", async () => {
        atualizarZoom();

        if (!stream) return;

        const track = stream.getVideoTracks()[0];

        if (!track.getCapabilities) {
          aplicarZoomDigital();

          return;
        }

        const capabilities = track.getCapabilities();

        if (capabilities.zoom) {
          try {
            await track.applyConstraints({
              advanced: [
                {
                  zoom: Number(controleZoom.value),
                },
              ],
            });
          } catch {
            aplicarZoomDigital();
          }
        } else {
          aplicarZoomDigital();
        }
      });

      /* TEXTO ZOOM */

      function atualizarZoom() {
        valorZoom.textContent = Number(controleZoom.value).toFixed(1) + "x";
      }

      /* ZOOM DIGITAL */

      function aplicarZoomDigital() {
        video.style.transform = `scale(${controleZoom.value})`;
      }

      /* GRADE */

      ativarGrade.addEventListener("change", () => {
        grade.style.display = ativarGrade.checked ? "grid" : "none";
      });

      /* FILTROS */

      function montarFiltro() {
        return `
    brightness(${brilho.value}%)
    contrast(${contraste.value}%)
    saturate(${saturacao.value}%)
  `;
      }

      function aplicarFiltro(filtro) {
        filtroAtual = filtro;

        if (filtro === "normal") {
          video.style.filter = montarFiltro();
        } else {
          video.style.filter = `${filtro} ${montarFiltro()}`;
        }

        botoesFiltro.forEach((botao) => {
          botao.classList.remove("ativo");

          if (botao.dataset.filtro === filtro) {
            botao.classList.add("ativo");
          }
        });
      }

      function obterFiltroCanvas() {
        if (filtroAtual === "normal") {
          return montarFiltro();
        }

        return `
    ${filtroAtual}
    ${montarFiltro()}
  `;
      }

      /* BOTÕES FILTRO */

      botoesFiltro.forEach((botao) => {
        botao.addEventListener("click", () => {
          aplicarFiltro(botao.dataset.filtro);
        });
      });

      /* AJUSTES */

      brilho.addEventListener("input", () => {
        brilhoValor.textContent = brilho.value;

        aplicarFiltro(filtroAtual);
      });

      contraste.addEventListener("input", () => {
        contrasteValor.textContent = contraste.value;

        aplicarFiltro(filtroAtual);
      });

      saturacao.addEventListener("input", () => {
        saturacaoValor.textContent = saturacao.value;

        aplicarFiltro(filtroAtual);
      });

      /* EVENTOS */

      btnIniciar.addEventListener("click", iniciarCamera);

      btnFoto.addEventListener("click", tirarFoto);

      btnGravar.addEventListener("click", gravarVideo);

      btnTorch.addEventListener("click", ativarFlash);

      btnMudar.addEventListener("click", mudarCamera);

      /* INICIALIZAÇÃO */

      grade.style.display = "none";

      aplicarFiltro("normal");

      verificarSuporte();
    </script>
  </body>
</html>
